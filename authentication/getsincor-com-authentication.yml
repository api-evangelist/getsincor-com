method: searched
source: >-
  a2a/getsincor-com-agent-card.json (no securitySchemes), well-known/getsincor-com-agent.json (deprecated
  `authentication` block), https://github.com/OrderofChaos33/SINCOR2/blob/main/docs/api/README.md
  (Authentication section), https://github.com/OrderofChaos33/SINCOR2/blob/main/docs/A2A_EXTERNAL_WIRE.md
  (the provider's own external probe log, 2026-09-10), the sdk/python and sdk/typescript clients in the same
