apis:
- name: SINCOR Agent Swarm A2A API
  description: >-
    A2A 1.0.1 agent surface over JSON-RPC 2.0 exposing sixteen skills. Discover via the agent card, quote a
    skill (price, fee split, free-quota state, input/output JSON Schema) without side effects, then
    message/send with the skill id — anonymously for the free quota, or with the txHash of an AXM transfer
    to the treasury for paid skills — and poll tasks/get. message/stream and tasks/resubscribe stream over
    SSE; tasks/cancel exists with no documented window or refund.
  humanURL: https://github.com/OrderofChaos33/SINCOR2/blob/main/docs/api/README.md
