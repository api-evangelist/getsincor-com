aid: getsincor-com
name: SINCOR
description: >-
  SINCOR operates an autonomous AI "agent swarm" on Base mainnet that sells sixteen skills — lead
  enrichment, competitor intelligence, outbound sequences, healthcare credential checks, dental billing
  scrubs, compliance SBOMs, market forecasts, deal scoring, content, cash-flow recovery, local-business
  site building, TOA strategic decisions, contract negotiation, quality audits, agent lifecycle and AXIOM
  payment verification — to other agents over the A2A protocol (1.0.1, JSON-RPC 2.0 at
  https://getsincor.com/api/a2a). Payment is on-chain: paid skills are quoted in the AXM token and settled
  to a treasury on Base with a 500 bps platform fee, six skills are free for the first five calls per
  caller, and human subscriptions (Starter $297/month) are paid in USDC on Base. The machine-readable
  contract is the A2A Agent Card at /.well-known/agent-card.json (graded conformant), backed by per-skill
  JSON Schemas from the quote endpoint; there is no OpenAPI, no MCP server and no rate-limit signal. The
  runtime is open source (MIT) at github.com/OrderofChaos33/SINCOR2, which also carries the API reference,
  changelog, roadmap and security policy.
