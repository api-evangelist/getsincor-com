discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: getsincor.com
  note: >-
    Served from the provider's only host, getsincor.com (Railway edge "railway-hikari", HTTP 200,
    application/json, 21562 bytes). The legacy /.well-known/agent.json path ALSO answers 200 with a
    DIFFERENT, older-shaped card (19620 bytes, same 16 skills, no protocolVersion, a deprecated
    `authentication` block) — captured in well-known/getsincor-com-agent.json. www.getsincor.com,
    api., docs. and mcp.getsincor.com have no DNS records, so getsincor.com is the whole host set.
    A negative-control path under /.well-known/ (security.txt, api-catalog, openid-configuration…)
    returns a real text/html 404, so the card is a real document and not a catch-all response.
    The homepage links the card directly ("View Raw Card"), /docs/a2a (a machine-readable JSON
    discovery document) names it as `discovery.agentCard`, and the open-source runtime at
    github.com/OrderofChaos33/SINCOR2 (homepage getsincor.com) ships it as static/.well-known/agent-card.json.
  ownership: >-
    provider.organization is "SINCOR" with provider.url https://getsincor.com; the declared A2A
    interface https://getsincor.com/api/a2a is on the same host and answers JSON-RPC 2.0 (see
    endpoint_liveness); the SINC token list and /.well-known/sinc-token.json on the same host name
    getsincor.com as the official website. Ownership is not in question.
  registry_lead: >-
    SINCOR reached the catalog through a2aregistry.org (415 agents, fetched 2026-09-19), which lists
    this card as "SINCOR Agent Swarm". The registry entry was the lead; the card above is what was
    actually fetched from the provider's host.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  grade_basis: >-
    All three hard checks pass: `capabilities` is an OBJECT ({streaming: true, pushNotifications: false,
    stateTransitionHistory: true}), `protocolVersion` is present at the root ("1.0.1"), and `skills` is an
    ARRAY of 16 entries each carrying id, name, description, tags, examples, inputModes and outputModes.
    The optional fields that separate conformant from near-conformant are all present: preferredTransport
    ("JSONRPC"), defaultInputModes and defaultOutputModes ([text/plain, application/json]), plus a provider
    block, documentationUrl, version ("2.0.0") and url. The card carries BOTH shapes at once — the 0.3-era
    root url/preferredTransport/protocolVersion AND the 1.0-era `supportedInterfaces[]` with protocolBinding
    and protocolVersion per interface — which the provider's own friction log (docs/A2A_EXTERNAL_WIRE.md,
    issue #219) says was done deliberately so older and newer clients both resolve the binding.
  protocol_version: 1.0.1
  preferred_transport: JSONRPC
  deviations:
    - id: no-securitySchemes
      severity: soft
      detail: >-
        The canonical card declares no `securitySchemes` and no `security`, although the provider's own
        API reference (docs/api/README.md) says the card "advertises an apiKey security scheme using the
        X-API-Key header" and the LEGACY card carries a deprecated `authentication` block naming X-API-Key
        with `schemes: []`. Observed behaviour matches the canonical card, not the docs: anonymous
        message/send is accepted (free quota, simulation mode) and an invalid X-API-Key is ignored. The
        key-issuance URL the legacy card names, https://getsincor.com/api-keys, returns 404.
    - id: unnamespaced-vendor-fields
      severity: soft
      detail: >-
        Six top-level fields outside the AgentCard schema — agentKit, baseCommerce, chain_id, paymentMethods,
        wallet, supportedInterfaces — carry the Base/AgentKit/x402 commerce metadata. A2A reserves
        `capabilities.extensions[]` for protocol extensions (the a2a-x402 extension URI is the
        conventional way to declare x402 settlement); none is declared, so an A2A client has no
        standard hook to discover that paid skills require an on-chain AXM payment before they run.
    - id: paymentMethods-scheme-x402-but-txHash-rail
      severity: informational
      detail: >-
        paymentMethods[0].scheme is "x402" and agentKit.actionProviders names an x402 provider, but the
        settlement the quote endpoint actually instructs is "pay N AXM to pay_to on Base, then include
        txHash in your tasks/send request" — a pre-payment-then-reference rail, not an HTTP 402
        PAYMENT-REQUIRED challenge. No 402 was observed on any probe. Recorded in conformance/ as declared,
        not verified.
    - id: legacy-card-diverges
      severity: soft
      detail: >-
        /.well-known/agent.json is not an alias of the canonical card: it lacks protocolVersion,
        preferredTransport, defaultInput/OutputModes and documentationUrl and adds a deprecated
        `authentication` block. Graded on its own it would be `flavored`. A client that resolves the legacy
        path first sees a different contract.
    - id: nonstandard-jsonrpc-error-codes
      severity: soft
      detail: >-
        tasks/get and tasks/cancel on an unknown task return generic -32602 Invalid params ("Task nonexistent
        not found") rather than A2A's -32001 TaskNotFoundError, and an unknown method returns -32601 with HTTP
        404 rather than HTTP 200. A2A client libraries keyed on the -32001..-32007 range will not recognise
        these as A2A errors.
    - id: skills-carry-io-modes-and-examples
      severity: positive
      detail: >-
        Every one of the 16 skills declares its own inputModes/outputModes, tags and at least one example,
        and /api/a2a/quote?skill_id=<id> publishes a JSON Schema input_schema and output_schema per skill —
        saved verbatim in a2a/getsincor-com-skill-quotes.json. That is more per-skill contract than most
        published cards carry.
    - id: unsigned
      severity: informational
      detail: No signatures[] block; the card is served over TLS only. supportsAuthenticatedExtendedCard is absent and agent/getAuthenticatedExtendedCard returns -32601.
