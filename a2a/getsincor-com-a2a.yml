endpoint_liveness:
  url: https://getsincor.com/api/a2a
  probed: '2026-09-20T03:07Z'
  observations:
    - {request: 'GET /api/a2a', http_status: 405, note: 'Method Not Allowed — the endpoint exists and expects the JSON-RPC POST the card declares.'}
    - {request: 'POST tasks/get {id: nonexistent}', http_status: 200, body: '{"error":{"code":-32602,"message":"Task nonexistent not found"},"id":2,"jsonrpc":"2.0"}'}
    - {request: 'POST tasks/list {}', http_status: 200, body: '{"id":9,"jsonrpc":"2.0","result":{"tasks":[]}}'}
    - {request: 'POST message/send with no skill', http_status: 200, body: '-32602 "Unknown skill ''''. Valid skills: [16 ids]" — the live skill list matches the card exactly.'}
    - {request: 'POST agent/getAuthenticatedExtendedCard', http_status: 404, body: '-32601 Method not found'}
    - {request: 'POST unknown method', http_status: 404, body: '-32601 Method not found (HTTP 404, not 200)'}
    - {request: 'GET /docs/a2a', http_status: 200, note: 'application/json discovery document listing methods [message/send, message/stream, tasks/get, tasks/cancel, tasks/list, tasks/resubscribe], quote/settle URLs, settlement {asset AXM, chainId 8453, platformFeeBps 500, treasury} and skillAliases [skill_id, skillId, skill].'}
